{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waypoint · Report Trail Condition</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1>Report Trail Issue</h1>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'report' %}">Report Trail</a>
            <a href="{% url 'search' %}">Search</a>
        </nav>
    </header>

    <main class="card">
        <form method="post" action="{% url 'report' %}">
            {% csrf_token %}
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required placeholder="e.g. Alex Honnold">

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required placeholder="alex@example.com">

            <label for="trail">Trail Name:</label>
            <input type="text" id="trail" name="trail" required placeholder="e.g. Skyline Loop">

            <label for="note">Condition Note:</label>
            <textarea id="note" name="note" rows="4" placeholder="Describe hazards, mud, fallen trees..."></textarea>

            <button type="submit">Submit Report</button>
        </form>
    </main>
</body>
</html>
