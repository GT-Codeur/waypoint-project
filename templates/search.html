{% extends "base.html" %}

{% block title %}Waypoint · Search Trails{% endblock %}

{% block content %}
    <h2>Search Trails</h2>
    <form method="get" action="{% url 'search' %}">
        <label for="q">Search Term:</label>
        <input type="text" id="q" name="q" value="{{ query }}" placeholder="Search by trail name or keyword...">
        <button type="submit">Search</button>
    </form>

    <section style="margin-top: 1.5rem;">
        {% if query %}
            <p>Search results for: <strong>"{{ query }}"</strong></p>
        {% else %}
            <p>Enter a search query above to find trails.</p>
        {% endif %}
    </section>
{% endblock %}
