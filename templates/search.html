{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waypoint · Trail Search</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1>Search Trails</h1>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'report' %}">Report Trail</a>
            <a href="{% url 'search' %}">Search</a>
        </nav>
    </header>

    <main class="card">
        <form method="get" action="{% url 'search' %}">
            <label for="q">Search Term:</label>
            <input type="text" id="q" name="q" value="{{ query }}" placeholder="Search by trail name or keyword...">
            <button type="submit">Search</button>
        </form>

        <section style="margin-top: 1.5rem;">
            {% if query %}
                <p>Search results for: <strong>"{{ query }}"</strong></p>
            {% else %}
                <p>Enter a search query above to find trails.</p>
            {% endif %}
        </section>
    </main>
</body>
</html>
